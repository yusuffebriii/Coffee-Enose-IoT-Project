[build]
target = "xtensa-esp32s3-none-elf"
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "link-arg=-nostartfiles"]

[target.xtensa-esp32s3-none-elf]
# Partition table default (single "factory") cukup - tidak ada OTA lagi di
# firmware ini (lihat catatan rewrite di src/main.rs).
runner = "espflash flash --monitor"

[env]
ESP_LOG = "INFO"

[unstable]
build-std = ["core", "alloc"]
