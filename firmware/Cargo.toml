[package]
name = "coffee-enose-firmware"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
esp-hal = { version = "=1.0.0-beta.1", features = ["esp32s3", "unstable"] }
esp-wifi = { version = "=0.14.1", features = [
    "esp32s3",
    "wifi",
    "esp-alloc",
    "log-04",
] }
esp-alloc = { version = "=0.8.0" }
esp-bootloader-esp-idf = "=0.1.0"
esp-backtrace = { version = "=0.16.0", features = [
    "esp32s3",
    "exception-handler",
    "panic-handler",
    "println",
] }
esp-println = { version = "=0.14.0", default-features = false, features = [
    "esp32s3",
    "uart",
    "log-04",
    "colors",
    "critical-section",
] }
esp-hal-embassy = { version = "=0.8.1", features = ["esp32s3"] }
# esp-storage di-pin ke versi lama yang tidak menarik PAC esp32s3 baru,
# supaya tidak bentrok sama esp-wifi. esp-hal-ota 0.4.1 dipilih khusus
# karena versi itu minta esp32s3 ^0.32.0 - PAS sama yang ditarik esp-wifi
# 0.14.1 kita (dicek manual lewat crates.io API sebelum ditambah, bukan
# nebak - sudah pernah bentrok versi di percobaan pertama dulu).
esp-storage = { version = "=0.4.0", features = ["esp32s3"] }
esp-hal-ota = { version = "=0.4.1", features = ["esp32s3"] }
embedded-storage = "0.3.1"

# Dinaikkan dari 20480 - MQTT_BUF_SIZE 12288 x 4 buffer di mqtt_task saja
# sudah ~49KB, ketemu langsung sebagai panic "task arena is full" di
# hardware (2026-09-23). 98304 dikasih margin jauh lebih longgar dari
# kebutuhan minimum supaya tidak perlu iterasi berkali-kali lagi kalau
# masih kurang.
embassy-executor = { version = "=0.7.0", features = ["task-arena-size-98304"] }
embassy-time = "=0.4.0"
embassy-net = { version = "=0.7.0", features = [
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv6",
    "log",
    "dns",
] }
embassy-futures = "0.1"
embassy-sync = "0.6"

rust-mqtt = { version = "=0.3.0", default-features = false }
ads1x1x = "0.3"
dht-sensor = "0.3"
embedded-hal = "1.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.1"

log = "0.4.27"
nb = "1.0.0"
embedded-io = "0.6.1"
heapless = "0.8.0"
static_cell = { version = "2.0", features = ["nightly"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
